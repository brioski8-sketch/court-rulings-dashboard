<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Court Rulings Briefing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="header-left">
    <h1>Court Rulings Briefing</h1>
    <div id="clock-strip">
      <span id="last-refresh" title="Last successful refresh"></span>
    </div>
  </div>
  <div id="status-bar">
    <span id="conn-dot" class="dot" title="Data connection"></span>
    <span id="ruling-count" class="units"></span>
  </div>
</header>

<main class="grid">
  <section class="widget" id="widget-court">
    <h2>Rulings <span class="units">· from pipeline jsonl snapshots · click column to sort</span></h2>
    <div class="widget-body"></div>
  </section>

  <section class="widget" id="widget-briefing">
    <h2>Weekly Briefing <span class="units">· latest .md reports</span></h2>
    <div class="widget-body"><div class="meta-row">Loading…</div></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
